    <link href='https://fonts.googleapis.com/css?family=Kanit' rel='stylesheet'>
    <link rel="stylesheet" href="style.css">
    <style>
        .image-stack__item--bottom {
          position: absolute;
          top: 0;
          z-index: -1;
        }

        .image-stack__item--top {
          padding: 25px 0 0 25px;
          text-align: left;
        }
        
        .circular--portrait { 
          position: relative;
          top: 0%;
          left: 25%;
          width: 200px;
          height: 200px;
          overflow: hidden;
          border-radius: 50%;
          border: 5px solid white;
        } 
          
          .circular--portrait img {
            width: 100%;
            height: auto;
            position: relative;
            top: -25px;
          }

        .pos {
          margin-top: 26px;
        }

        h6 {
          color: #000;
          font-family: Kanit;
          font-size: 18px;
          font-style: normal;
          font-weight: 400;
          line-height: normal;
        }
        
        a {
          color: #000;
          text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
      <div style="height: 250px;">
